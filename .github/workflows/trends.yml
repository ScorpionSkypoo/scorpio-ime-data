name: Google Trends 快照

# Google Trends 台灣熱搜的 RSS 每次只給當下的 10 個：每 2 小時抓一次存成 artifact（保留 10 天），
# 每週的新詞雷達（radar.yml）下載這一週的快照一起用
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python radar/collect.py snapshot.jsonl --trends-only
      - uses: actions/upload-artifact@v4
        with:
          name: trends-${{ github.run_id }}
          path: snapshot.jsonl
          retention-days: 10
