name: 新詞雷達

# 每週一早上（台灣時間 02:00）蒐集 Google Trends 熱搜、PTT 近期文章與推文、公視新聞、維基百科新條目與熱門條目，
# 找出詞庫還沒有的新詞，開 PR 把候選詞加進 sources/trendy.txt；taiwan-md 的新專有名詞加進 sources/tw_md.txt。
# 審核時刪掉不要的行再合併，合併後「建置並發佈資料包」會自動發佈新版流行用語。
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install opencc   # 過濾含簡體字的候選詞

      - name: 下載基底詞庫
        run: |
          mkdir -p base work
          gh release download base --dir base --pattern 'scorpio_dict.db.gz'
          gunzip -c base/scorpio_dict.db.gz > work/dict.db
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 下載這週的 Google Trends 快照
        run: |
          mkdir -p work/trends
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"trends-\")) | select(.expired | not) | select(.created_at >= \"$SINCE\") | .id" |
          while read -r id; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > work/trends/$id.zip &&
              unzip -q -o -d work/trends/$id work/trends/$id.zip && rm work/trends/$id.zip || true
          done
          echo "快照 $(ls work/trends | wc -l) 份"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 蒐集語料
        run: python radar/collect.py work/texts.jsonl --days 7 --trends-snapshots work/trends
        env:
          # 選用：Meta 通過 threads_keyword_search 審核後，把 token 放進 repo secrets 就會一起搜尋 Threads
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: taiwan-md 新詞候選
        run: |
          git clone --depth 1 https://github.com/frank890417/taiwan-md work/taiwan-md
          python tools/mine_taiwan_md.py work/taiwan-md work/dict.db work/twmd.tsv || true

      - name: 找新詞
        run: |
          # OpenCC GitHub master 最新的台灣用語詞典（pip 版只到它發佈的那版）
          curl -fsSL -o work/TWPhrases.txt https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary/TWPhrases.txt || true
          python radar/discover.py work/texts.jsonl work/dict.db work/report.md --apply sources/trendy.txt --opencc-twphrases work/TWPhrases.txt \
            --twmd work/twmd.tsv --twmd-apply sources/tw_md.txt --en-apply sources/en_extra.txt

      - name: 開 PR
        run: |
          if git diff --quiet; then echo "沒有新的候選詞"; exit 0; fi
          D=$(TZ=Asia/Taipei date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B="radar/$D-$(TZ=Asia/Taipei date +%H%M)"; git checkout -b "$B"
          git commit -am "新詞雷達 $D 候選詞"
          git push -u origin "$B"
          gh pr create --title "新詞雷達 $D" --body-file work/report.md
        env:
          GH_TOKEN: ${{ github.token }}
