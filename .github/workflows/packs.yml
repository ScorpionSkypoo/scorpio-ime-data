name: 建置並發佈資料包

# sources/、packs.json 有變動（例如新詞雷達的 PR 合併）就重建流行用語；plugins/、layouts/ 有變動就重建改到的外掛、版面；
# 也可以手動執行，指定要重建的資料包、外掛或版面（接續詞語料會先下載約 750 MB 的語料）
on:
  push:
    branches: [main]
    paths: ["sources/**", "packs.json", "plugins/**", "layouts/**", "config/**"]
  workflow_dispatch:
    inputs:
      packs:
        description: "要重建的資料包（空白分隔）"
        default: "trendy"
        required: true

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install opencc pyarrow

      - name: 決定版本與資料包
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 排隊期間別的建置可能已經發佈過：先拿最新的 manifest
          git pull --rebase origin main
          # 版本號用台灣時間；萬一 manifest 裡已有更大的版本（手動發佈過），就接在它後面，確保一定往上加
          V=$(TZ=Asia/Taipei date +%Y.%m.%d.%H%M)
          V=$(python3 - "$V" <<'PY'
          import json, sys
          v = sys.argv[1]
          key = lambda s: [int(x) for x in s.split(".")]
          m = json.load(open("manifest.json"))
          top = max((e["version"] for e in m.get("packs", []) + m.get("plugins", []) + m.get("layouts", [])), key=key, default="0")
          if key(top) >= key(v):
              parts = key(top)
              parts[-1] += 1
              v = ".".join(map(str, parts))
          print(v)
          PY
          )
          # 同一分鐘已經有 Release 就往上加
          while gh release view "packs-$V" > /dev/null 2>&1; do
            V="${V%.*}.$(( ${V##*.} + 1 ))"
          done
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.packs }}" ]; then
            P="${{ github.event.inputs.packs }}"
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            P=""
            echo "$CHANGED" | grep -qE '^(sources/|packs.json)' && P="trendy"
            # 各資料包自己的來源檔（新詞雷達的 PR 會改到 tw_md.txt）
            echo "$CHANGED" | grep -qx 'sources/tw_md.txt' && P="$P tw_md"
            echo "$CHANGED" | grep -qx 'sources/tw_life.txt' && P="$P tw_life"
            echo "$CHANGED" | grep -qx 'sources/core_fixes.txt' && P="$P core tw_places"
            echo "$CHANGED" | grep -qx 'sources/en_extra.txt' && P="$P en"
            for f in $(echo "$CHANGED" | grep -E '^(plugins|layouts|config)/.+\.json$'); do
              [ -f "$f" ] && P="$P $(basename "$f" .json)"
            done
          fi
          echo "packs=$P" >> "$GITHUB_OUTPUT"

      - name: 下載基底詞庫
        run: |
          mkdir -p base
          gh release download base --dir base --pattern "scorpio_*.db.gz"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 下載語料與原始資料
        if: contains(steps.plan.outputs.packs, 'bg_') || contains(steps.plan.outputs.packs, 'cs_terms') || contains(steps.plan.outputs.packs, 'moe_dict')
        run: tools/fetch_corpus.sh work/corpus ${{ steps.plan.outputs.packs }}

      - name: 建置
        run: tools/build.sh work ${{ steps.plan.outputs.version }} ${{ steps.plan.outputs.packs }}

      - name: 發佈
        run: |
          V=${{ steps.plan.outputs.version }}
          gh release create "packs-$V" work/out/* --title "資料包 $V" \
            --notes "重建：${{ steps.plan.outputs.packs }}"
          gh release upload base work/base/*.gz --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "資料包 $V：${{ steps.plan.outputs.packs }}"
          git pull --rebase origin main
          git push
        env:
          GH_TOKEN: ${{ github.token }}
